<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0a09; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .serif { font-family: Georgia, "Times New Roman", "Noto Serif TC", serif; }

  /* Loading veil */
  #loader {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0b0a09; color: #d8c9ae;
    transition: opacity 1.1s ease; pointer-events: none;
  }
  #loader.done { opacity: 0; }
  #loader .rule { width: 64px; height: 1px; background: rgba(216, 180, 120, .55); }
  #loader .txt { font-size: 13px; letter-spacing: .35em; text-indent: .35em; opacity: .85; }

  /* ---------- AAA game HUD vertical menu ---------- */
  /* Dock wrapper: invisible on desktop (children position freely),
     a right-side column on narrow screens. */
  #dock { display: contents; }
  #menu {
    position: fixed; z-index: 22; left: 0; bottom: 24px;
    display: flex; flex-direction: column; gap: 2px;
    transition: opacity .5s ease;
  }
  #menu.receded { opacity: .3; }
  #menu.receded:hover, #menu.receded:focus-within { opacity: 1; }
  .mitem {
    appearance: none; border: 0; cursor: pointer; text-align: left; position: relative;
    background: linear-gradient(90deg, rgba(10, 10, 12, 0.78) 0%, rgba(10, 10, 12, 0.25) 75%, rgba(10, 10, 12, 0) 100%);
    backdrop-filter: blur(6px); color: #ece1cb; min-width: 258px;
    font-size: 16.5px; letter-spacing: .22em; padding: 13px 64px 13px 30px;
    animation: menuIn .7s ease both;
  }
  .mitem:nth-child(1) { animation-delay: .95s; }
  .mitem:nth-child(2) { animation-delay: 1.03s; }
  .mitem:nth-child(3) { animation-delay: 1.11s; }
  .mitem:nth-child(4) { animation-delay: 1.19s; }
  .mitem:nth-child(5) { animation-delay: 1.27s; }
  @keyframes menuIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @keyframes menuInR { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  .mitem::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: #e8b478; opacity: 0; transition: opacity .25s ease;
    box-shadow: 0 0 12px rgba(232, 180, 120, .8);
  }
  .mitem .mlabel {
    display: inline-block;
    transition: transform .3s ease, letter-spacing .3s ease, text-shadow .3s ease, color .3s ease;
  }
  .mitem:hover::before, .mitem:focus-visible::before, .mitem.active::before { opacity: 1; }
  .mitem:hover .mlabel, .mitem:focus-visible .mlabel {
    transform: translateX(6px); letter-spacing: .3em;
    text-shadow: 0 0 18px rgba(255, 205, 140, .45);
  }
  .mitem.active .mlabel { transform: translateX(6px); color: #ffe9c4; }
  .mitem:focus-visible { outline: 1px solid rgba(255, 205, 140, .8); outline-offset: -1px; }

  /* ---------- Cinematic spatial text panel ---------- */
  #panel {
    position: fixed; left: 0; top: 0; z-index: 24; width: min(360px, 36vw);
    display: flex; flex-direction: column;
    background: rgba(10, 11, 13, 0.62); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(224, 180, 120, .55); border-radius: 3px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    padding: 22px 24px 16px; color: #ece4d2;
    max-height: calc(100vh - 160px);
    opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s;
  }
  #panel.open { opacity: 1; visibility: visible; transition: opacity .45s ease; }
  #panelTitle {
    margin: 0 0 10px; font-size: 21px; font-weight: 400; letter-spacing: .14em; color: #f2e6c8;
    flex: none;
    opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease;
  }
  #panelContent {
    font-size: 14.5px; line-height: 1.85; color: rgba(236, 228, 210, .88);
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: rgba(224, 180, 120, .4) transparent;
    opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease;
  }
  #panel.show-title #panelTitle { opacity: 1; transform: none; }
  #panel.show-content #panelContent { opacity: 1; transform: none; }
  #panelContent > *:first-child { margin-top: 0; }
  #panelContent > *:last-child { margin-bottom: 0; }
  #panelContent p { margin: 0 0 10px; }
  #panelContent h1, #panelContent h2, #panelContent h3 {
    font-family: Georgia, "Times New Roman", "Noto Serif TC", serif; font-weight: 400;
    color: #f2e6c8; letter-spacing: .08em; margin: 14px 0 8px;
  }
  #panelContent h1 { font-size: 19px; }
  #panelContent h2 { font-size: 17px; }
  #panelContent h3 { font-size: 15.5px; }
  #panelContent ul, #panelContent ol { margin: 0 0 10px; padding-left: 22px; }
  #panelContent li { margin: 3px 0; }
  #panelContent a { color: #eec887; text-decoration: none; border-bottom: 1px solid rgba(238, 200, 135, .45); }
  #panelContent a:hover { color: #ffe9c4; border-bottom-color: #ffe9c4; }
  #panelContent strong { color: #f6ecd4; font-weight: 600; }
  #panelContent code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
    background: rgba(255, 255, 255, .07); padding: 1px 5px; border-radius: 3px;
  }
  #panelContent .placeholder { color: rgba(236, 228, 210, .55); letter-spacing: .12em; }
  #panelBack {
    display: block; flex: none; align-self: flex-end; margin: 16px 0 0 auto; padding: 6px 0; appearance: none; border: 0; background: none; cursor: pointer;
    color: rgba(232, 205, 150, .85); font-size: 12px; letter-spacing: .3em;
    opacity: 0; transition: opacity .5s ease;
  }
  #panel.show-content #panelBack { opacity: 1; }
  #panelBack:hover { color: #ffe9c4; }

  /* ---------- Language toggle ---------- */
  #langToggle {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: 18px; z-index: 26;
    display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 2px;
    background: rgba(10, 10, 12, .5); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 205, 140, .22);
  }
  #langToggle button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    color: rgba(236, 225, 203, .6); font-size: 12px; letter-spacing: .14em; padding: 7px 12px;
  }
  #langToggle button.active { color: #ffe9c4; background: rgba(232, 180, 120, .16); }
  #langToggle .sep { width: 1px; height: 14px; background: rgba(255, 205, 140, .25); }

  /* Viewpoint controls for scene review (temporary) */
  #fallback {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: #0b0a09; color: #d8c9ae; text-align: center; padding: 24px; line-height: 1.9;
    font-size: 14px; letter-spacing: .08em;
  }
  @media (max-width: 640px) {
    /* Dock: menu cards anchored at the bottom-right, gradient mirrored. */
    #dock {
      display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
      position: fixed; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 22;
      transition: opacity .4s ease;
    }
    #menu { position: static; left: auto; bottom: auto; }
    .mitem {
      font-size: 15px; padding: 11px 22px 11px 44px; min-width: 0; text-align: right;
      background: linear-gradient(270deg, rgba(10, 10, 12, 0.78) 0%, rgba(10, 10, 12, 0.25) 75%, rgba(10, 10, 12, 0) 100%);
      animation-name: menuInR;
    }
    .mitem::before { left: auto; right: 0; }
    .mitem:hover .mlabel, .mitem:focus-visible .mlabel { transform: translateX(-6px); }
    .mitem.active .mlabel { transform: translateX(-6px); }
    /* Panel becomes a bottom sheet on narrow screens */
    #panel {
      left: 12px !important; right: 12px; top: auto !important;
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: auto; transform: none !important; max-height: 42vh;
    }
    /* Back prompt: bigger tap target on narrow screens */
    #panelBack { padding: 10px 2px; }
    /* While the sheet is open, hide the whole dock it would cover */
    body.panel-open #dock { opacity: 0; pointer-events: none; }
    #langToggle { right: 12px; }
    #langToggle button { padding: 6px 10px; }
  }
</style>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   STEP 3 — Real glass window + mobile menu dock, on top of
   the Step 2 scene, menu HUD, zone flights and panels.
   Real geometry, real shadows, real glass: the sun
   is a shadow-casting directional light outside the left-wall
   window; the original blinds live behind ?blinds=1.
   All textures are procedural canvas textures. No external
   images.
   ============================================================ */

const params = new URLSearchParams(location.search);
const STATIC = params.has('static');
const START_VIEW = params.get('view') || 'main';

/* ---------- deterministic pseudo-random (stable layout) ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261113);
const rr = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

/* ---------- renderer / scene / camera ---------- */
const app = document.getElementById('app');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  document.getElementById('loader').classList.add('done');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0c0a);

const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.05, 60);

/* ---------- procedural canvas textures ---------- */
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function makeTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso;
  if (opts.srgb !== false) tex.colorSpace = THREE.SRGBColorSpace;
  if (opts.repeat) tex.repeat.set(opts.repeat[0], opts.repeat[1]);
  return tex;
}
function noiseOver(ctx, w, h, n, colors, aMin, aMax, sMin, sMax) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.globalAlpha = aMin + Math.random() * (aMax - aMin);
    const s = sMin + Math.random() * (sMax - sMin);
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  ctx.globalAlpha = 1;
}
/* Worn hardwood planks */
const floorTex = makeTex(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#4e3826'; ctx.fillRect(0, 0, w, h);
  const rows = 8, ph = h / rows;
  for (let r = 0; r < rows; r++) {
    const tone = 62 + Math.floor(Math.random() * 26);
    ctx.fillStyle = `rgb(${tone + 22},${Math.floor(tone * 0.72)},${Math.floor(tone * 0.45)})`;
    ctx.fillRect(0, r * ph, w, ph);
    // grain streaks
    for (let i = 0; i < 90; i++) {
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(30,18,10,0.20)' : 'rgba(150,110,70,0.14)';
      ctx.lineWidth = 0.6 + Math.random() * 1.6;
      const y = r * ph + Math.random() * ph;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(w * 0.3, y + rr(-4, 4), w * 0.6, y + rr(-4, 4), w, y + rr(-3, 3));
      ctx.stroke();
    }
    // plank joints
    let x = Math.random() * 300;
    while (x < w) {
      ctx.fillStyle = 'rgba(15,8,4,0.55)';
      ctx.fillRect(x, r * ph, 2, ph);
      x += 260 + Math.random() * 380;
    }
    ctx.fillStyle = 'rgba(12,7,4,0.7)';
    ctx.fillRect(0, r * ph, w, 2);
    // wear patches
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(210,175,130,0.05)';
      ctx.beginPath();
      ctx.ellipse(Math.random() * w, r * ph + Math.random() * ph, 60 + Math.random() * 120, 14 + Math.random() * 22, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}, { repeat: [2.6, 2.2] });
const floorBump = makeTex(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  const rows = 8, ph = h / rows;
  for (let r = 0; r < rows; r++) {
    for (let i = 0; i < 70; i++) {
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(40,40,40,0.35)' : 'rgba(200,200,200,0.25)';
      ctx.lineWidth = 0.6 + Math.random() * 1.8;
      const y = r * ph + Math.random() * ph;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y + rr(-4, 4)); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, r * ph, w, 3);
  }
}, { srgb: false, repeat: [2.6, 2.2] });
/* Aged plaster */
function plasterDraw(base, blotches) {
  return (ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) {
      ctx.fillStyle = blotches[i % blotches.length];
      ctx.globalAlpha = 0.05 + Math.random() * 0.08;
      ctx.beginPath();
      ctx.ellipse(Math.random() * w, Math.random() * h, 50 + Math.random() * 160, 40 + Math.random() * 120, Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    noiseOver(ctx, w, h, 9000, ['#000000', '#ffffff', '#3a332c'], 0.02, 0.06, 1, 2.5);
    // faint vertical age streaks
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = 'rgba(40,34,28,0.05)';
      ctx.fillRect(Math.random() * w, 0, 3 + Math.random() * 9, h);
    }
  };
}
const plasterTex = makeTex(512, 512, plasterDraw('#6f655a', ['#5d5348', '#7d7266', '#665c50']), { repeat: [2, 1.4] });
const plasterBump = makeTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  noiseOver(ctx, w, h, 12000, ['#3a3a3a', '#c8c8c8'], 0.05, 0.12, 1, 3);
}, { srgb: false, repeat: [2, 1.4] });
/* Cork */
const corkTex = makeTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#9c7c50'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = ['#8a6a42', '#ab8c5e', '#93764c'][i % 3];
    ctx.globalAlpha = 0.10 + Math.random() * 0.10;
    ctx.beginPath();
    ctx.ellipse(Math.random() * w, Math.random() * h, 30 + Math.random() * 90, 24 + Math.random() * 70, Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 5200; i++) {
    ctx.fillStyle = Math.random() > 0.45 ? 'rgba(70,50,26,0.5)' : 'rgba(210,180,130,0.45)';
    const s = 0.8 + Math.random() * 2.4;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s * (0.6 + Math.random() * 0.8));
  }
  for (let i = 0; i < 260; i++) { // tiny pores
    ctx.fillStyle = 'rgba(52,38,20,0.75)';
    ctx.beginPath();
    ctx.arc(Math.random() * w, Math.random() * h, 0.7 + Math.random() * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}, { repeat: [2.2, 1.2] });
const corkBump = makeTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(30,30,30,0.5)' : 'rgba(210,210,210,0.4)';
    const s = 1 + Math.random() * 2.5;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
}, { srgb: false, repeat: [2.2, 1.2] });
/* Dark walnut wood (desk, frame, shelves) */
const walnutTex = makeTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#4a3220'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 130; i++) {
    ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(28,17,9,0.35)' : 'rgba(120,86,50,0.28)';
    ctx.lineWidth = 0.7 + Math.random() * 2.2;
    const y = Math.random() * h;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(w * 0.3, y + rr(-6, 6), w * 0.65, y + rr(-6, 6), w, y + rr(-4, 4));
    ctx.stroke();
  }
  noiseOver(ctx, w, h, 2500, ['#000000', '#8a6a44'], 0.03, 0.07, 1, 2);
}, { repeat: [1, 1] });
/* Paper fibre */
const paperTex = makeTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#efe7d2'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(160,145,115,0.25)' : 'rgba(255,252,240,0.3)';
    ctx.lineWidth = 0.6;
    const x = Math.random() * w, y = Math.random() * h, a = Math.random() * Math.PI;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5); ctx.stroke();
  }
});
const paperBump = makeTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  noiseOver(ctx, w, h, 3000, ['#555555', '#b0b0b0'], 0.08, 0.16, 1, 2);
}, { srgb: false });
/* Ruled notebook page */
const ruledTex = makeTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#efe9da'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,140,170,0.5)'; ctx.lineWidth = 1;
  for (let y = 28; y < h; y += 26) { ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(w - 12, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(190,120,110,0.55)';
  ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(30, h); ctx.stroke();
  // faint handwriting squiggles
  ctx.strokeStyle = 'rgba(60,60,80,0.5)'; ctx.lineWidth = 1.1;
  for (let r = 0; r < 5; r++) {
    const y = 22 + r * 26;
    ctx.beginPath();
    let x = 38;
    ctx.moveTo(x, y);
    while (x < w - 30) { x += 4 + Math.random() * 8; ctx.lineTo(x, y + rr(-2.5, 1)); }
    ctx.stroke();
  }
});
/* Worn leather */
const leatherTex = makeTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#3a2318'; ctx.fillRect(0, 0, w, h);
  noiseOver(ctx, w, h, 5000, ['#1c0f08', '#5a3a24', '#2c1a10'], 0.05, 0.12, 1, 3);
  for (let i = 0; i < 14; i++) {
    ctx.strokeStyle = 'rgba(15,8,4,0.35)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    const y = Math.random() * h;
    ctx.moveTo(0, y); ctx.bezierCurveTo(w * 0.3, y + rr(-8, 8), w * 0.6, y + rr(-8, 8), w, y + rr(-5, 5));
    ctx.stroke();
  }
});
/* Abstract procedural "photo" art for polaroids (no external images) */

// Curled paper geometry: bottom corners lift away from the board
function curledCardGeo(w, h, lift) {
  const geo = new THREE.PlaneGeometry(w, h, 6, 6);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const down = THREE.MathUtils.clamp((h / 2 - y) / h, 0, 1); // 0 top → 1 bottom
    const side = Math.pow(Math.abs(x) / (w / 2), 2);
    const z = lift * Math.pow(down, 2) * (0.35 + 0.65 * side) + rr(-0.0012, 0.0012);
    pos.setZ(i, z);
  }
  geo.computeVertexNormals();
  return geo;
}

/* ---------- Text on the pinboard cards ----------
   Each paper card gets its own canvas texture with text drawn on it.
   Words are excerpts of Averin's own panel text — nothing invented.
   Textures repaint when the language toggles. */
const cardPainters = [];
const CARD_FONT = `Georgia, 'Noto Serif TC', 'Songti TC', serif`;
function wrapText(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let rest = para;
    while (rest.length) {
      if (ctx.measureText(rest).width <= maxW) { out.push(rest); break; }
      let n = rest.length;
      while (n > 1 && ctx.measureText(rest.slice(0, n)).width > maxW) n--;
      const sp = rest.lastIndexOf(' ', n);
      if (sp > 0) { out.push(rest.slice(0, sp)); rest = rest.slice(sp + 1); }
      else { out.push(rest.slice(0, n)); rest = rest.slice(n); }
    }
    if (!para) out.push('');
  }
  return out;
}
function fitFont(ctx, text, px, weight, maxW) {
  let size = px;
  while (size > 20) {
    ctx.font = `${weight} ${size}px ${CARD_FONT}`;
    if (ctx.measureText(text).width <= maxW) break;
    size -= 2;
  }
  return size;
}
function makeCardPainter(w, h, bgColor, textData, kind) {
  const W = 512, H = Math.max(160, Math.round(512 * h / w));
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const bg = '#' + new THREE.Color(bgColor).getHexString();
  function paint(lang) {
    const t = textData[lang] || textData.zh;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 260; i++) {
      ctx.fillStyle = `rgba(120,100,70,${0.04 + Math.random() * 0.06})`;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
    }
    ctx.fillStyle = '#3b3129';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    if (kind === 'caption') {
      const size = fitFont(ctx, t.title, 40, 'italic 600', W * 0.8);
      ctx.font = `italic 600 ${size}px ${CARD_FONT}`;
      ctx.fillText(t.title, W / 2, H * 0.885);
    } else {
      const maxW = W - 112;
      const titleSize = fitFont(ctx, t.title, 54, '600', maxW);
      const linePx = 30;
      ctx.font = `${linePx}px ${CARD_FONT}`;
      const bodyLines = [];
      for (const ln of (t.lines || [])) bodyLines.push(...wrapText(ctx, ln, maxW));
      const gapT = 26, gapL = 14;
      const totalH = titleSize + gapT + bodyLines.length * (linePx + gapL);
      let y = (H - totalH) / 2 + titleSize * 0.85;
      ctx.font = `600 ${titleSize}px ${CARD_FONT}`;
      ctx.fillText(t.title, W / 2, y);
      y += gapT + linePx * 0.85;
      ctx.font = `${linePx}px ${CARD_FONT}`;
      for (const ln of bodyLines) { ctx.fillText(ln, W / 2, y); y += linePx + gapL; }
    }
    tex.needsUpdate = true;
  }
  paint('zh');
  cardPainters.push(paint);
  return tex;
}
function repaintCards(lang) { cardPainters.forEach((p) => p(lang)); }
function textCardMat(w, h, bgColor, textData) {

function polaroidFrameMat(w, h, captionData) {

/* ---------- Card lift registry ----------
   Cards + polaroids float off the board when their zone is focused. */
const boardItems = [];
function registerBoardItem(obj, zone) {
  boardItems.push({ obj, zone, baseZ: obj.position.z, lift: 0, goal: 0, liftAt: 0 });
}
function setZoneLift(zone) {
  const now = performance.now();
  for (const it of boardItems) {
    if (it.zone === zone) { it.goal = 1; it.liftAt = now + 450; }
    else { it.goal = 0; it.liftAt = now + 60; }
  }
}
function clearZoneLift() {
  const now = performance.now();
  boardItems.forEach((it) => { it.goal = 0; it.liftAt = now + 60; });
}
function snapBoardLift() {
  for (const it of boardItems) {
    it.lift = it.goal; it.liftAt = 0;
    it.obj.position.z = it.baseZ + it.lift * 0.055;
  }
}
const pinHeadMats = {
  brass: M.brass,
  red: new THREE.MeshStandardMaterial({ color: 0xa83a2e, roughness: 0.35, metalness: 0.15 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x2e6a66, roughness: 0.35, metalness: 0.15 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xe8e0cc, roughness: 0.4, metalness: 0.05 }),
  amber: new THREE.MeshStandardMaterial({ color: 0xc07f2e, roughness: 0.35, metalness: 0.15 }),
};
function makePin(kind, parent, x, y, z) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.015, 14, 10), pinHeadMats[kind] || M.brass);
  head.scale.z = 0.72;
  head.castShadow = true;
  const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0012, 0.035, 8), M.steel);
  needle.rotation.x = Math.PI / 2;
  needle.position.z = -0.014;
  needle.castShadow = true;
  g.add(head, needle);
  g.position.set(x, y, z);
  g.rotation.set(rr(-0.08, 0.08), rr(-0.08, 0.08), rr(-0.1, 0.1));
  parent.add(g);
  return g;
}
function addCard(x, y, w, h, rot, mat, pinKind, opts = {}) {
  const lift = opts.lift ?? 0.014;
  const card = new THREE.Mesh(curledCardGeo(w, h, lift), mat);
  card.position.set(x, y, BOARD.frontZ + 0.006 + (opts.zOff || 0));
  card.rotation.z = rot;
  card.castShadow = true;
  card.receiveShadow = true;
  scene.add(card);
  // Pins parented to the card (near the top edge) so they lift with it
  makePin(pinKind, card, 0, h / 2 - 0.035, 0.008);
  if (opts.secondPin) {
    makePin(opts.secondPin, card, -0.05, h / 2 - 0.05, 0.008);
  }
  if (opts.zone !== undefined) registerBoardItem(card, opts.zone);
  return card;
}
function addPolaroid(x, y, w, rot, seed, pinKind, opts = {}) {
  const h = w * 1.22;
  const g = new THREE.Group();
  const frameMat = opts.caption
    ? polaroidFrameMat(w, h, opts.caption)
    : new THREE.MeshStandardMaterial({ color: 0xf2ede2, roughness: 0.85, side: THREE.DoubleSide });
  const frame = new THREE.Mesh(curledCardGeo(w, h, 0.01), frameMat);
  frame.castShadow = true; frame.receiveShadow = true;
  const art = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.82, w * 0.82),
    new THREE.MeshStandardMaterial({ map: photoArt(seed), roughness: 0.6 }));
  art.position.set(0, h * 0.09, 0.004);
  art.receiveShadow = true;
  g.add(frame, art);
  g.position.set(x, y, BOARD.frontZ + 0.008);
  g.rotation.z = rot;
  scene.add(g);
  makePin(pinKind, g, 0, h / 2 - 0.03, 0.008);
  if (opts.zone !== undefined) registerBoardItem(g, opts.zone);
  return g;
}

const bookColors = [0x7a3b2e, 0x2e4a5e, 0x5e4632, 0x3e5a3a, 0x6b5a2e, 0x4a3a5e, 0x8a6a3a, 0x37474f, 0x5a2e35, 0x2e5a50];
function buildShelfUnit(zc, wLen) {
  const xInner = ROOM.x - 0.02, depth = 0.32;
  const xc = xInner - depth / 2;
  const H = 2.2;
  const g = new THREE.Group();
  const side = (z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(depth, H, 0.05), M.walnut);
    m.position.set(xc, H / 2, z); m.castShadow = true; m.receiveShadow = true; g.add(m);
  };
  side(zc - wLen / 2 + 0.025); side(zc + wLen / 2 - 0.025);
  const topB = new THREE.Mesh(new THREE.BoxGeometry(depth, 0.05, wLen), M.walnut);
  topB.position.set(xc, H - 0.025, zc); topB.castShadow = true; topB.receiveShadow = true; g.add(topB);
  const backP = new THREE.Mesh(new THREE.BoxGeometry(0.03, H, wLen), M.walnutDark);
  backP.position.set(ROOM.x - 0.035, H / 2, zc); backP.receiveShadow = true; g.add(backP);
  const shelfYs = [0.08, 0.62, 1.16, 1.7];
  for (const sy of shelfYs) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(depth - 0.03, 0.04, wLen - 0.1), M.walnut);
    s.position.set(xc, sy, zc); s.castShadow = true; s.receiveShadow = true; g.add(s);
  }
  // Books
  for (let s = 0; s < shelfYs.length; s++) {
    const sy = shelfYs[s];
    let z = zc - wLen / 2 + 0.12;
    const zEnd = zc + wLen / 2 - 0.12;
    while (z < zEnd - 0.05) {
      if (rng() < 0.1) { z += rr(0.05, 0.14); continue; } // breathing gap
      const bw = rr(0.025, 0.05), bh = rr(0.26, 0.42), bd = rr(0.18, 0.24);
      const mat = new THREE.MeshStandardMaterial({ color: pick(bookColors), roughness: 0.82 });
      const b = new THREE.Mesh(new THREE.BoxGeometry(bd, bh, bw), mat);
      const lean = rng() < 0.08 ? rr(0.1, 0.2) * (rng() < 0.5 ? 1 : -1) : 0;
      b.position.set(xc - 0.02, sy + 0.02 + bh / 2, z + bw / 2);
      b.rotation.x = lean;
      if (lean) b.position.y -= Math.abs(lean) * 0.06;
      b.castShadow = true; b.receiveShadow = true;
      g.add(b);
      z += bw + rr(0.001, 0.006);
      // occasional horizontal stack
      if (rng() < 0.08 && z < zEnd - 0.3) {
        const n = 2 + Math.floor(rng() * 3);
        for (let k = 0; k < n; k++) {
          const hb = new THREE.Mesh(new THREE.BoxGeometry(rr(0.2, 0.26), 0.035, rr(0.16, 0.2)),
            new THREE.MeshStandardMaterial({ color: pick(bookColors), roughness: 0.82 }));
          hb.position.set(xc - 0.02, sy + 0.04 + k * 0.037, z + 0.1);
          hb.rotation.y = rr(-0.15, 0.15);
          hb.castShadow = true; hb.receiveShadow = true;
          g.add(hb);
        }
        z += 0.24;
      }
    }
  }
  scene.add(g);
  return g;
}

  const geo = new THREE.PlaneGeometry(0.075, 0.55, 1, 5);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = (y + 0.275) / 0.55; // 0 bottom → 1 tip
    pos.setX(i, pos.getX(i) * (1 - t * 0.75));
    pos.setZ(i, Math.sin(t * Math.PI) * 0.06 + t * t * 0.16);

  return geo;

function escapeHtml(s) {

}
function inlineMd(s) {
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
    if (/^(https?:|mailto:)/i.test(url)) {
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;

function renderMarkdown(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  let html = '', i = 0, para = [];
  const flushPara = () => {
    if (para.length) { html += `<p>${para.map(inlineMd).join('<br>')}</p>`; para = []; }
  };
  while (i < lines.length) {
    const line = lines[i];
    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (heading) {
      flushPara();
      html += `<h${heading[1].length}>${inlineMd(heading[2])}</h${heading[1].length}>`;
      i++;
    } else if (ul) {
      flushPara();
      const items = [];
      while (i < lines.length) { const m = lines[i].match(/^\s*[-*]\s+(.*)$/); if (!m) break; items.push(m[1]); i++; }
      html += `<ul>${items.map((t) => `<li>${inlineMd(t)}</li>`).join('')}</ul>`;
    } else if (ol) {
      flushPara();
      const items = [];
      while (i < lines.length) { const m = lines[i].match(/^\s*\d+[.)]\s+(.*)$/); if (!m) break; items.push(m[1]); i++; }
      html += `<ol>${items.map((t) => `<li>${inlineMd(t)}</li>`).join('')}</ol>`;
    } else if (/^\s*$/.test(line)) {
      flushPara(); i++;
    } else {
      para.push(line); i++;
    }
  }
  flushPara();
  return html;
}

  const c = zoneCam(i);
  if (opts.instant) {
    if (gsap) gsap.killTweensOf([camPos, camLook]);
    manualTween = null;
    camPos.set(c.pos[0], c.pos[1], c.pos[2]);
    camLook.set(c.look[0], c.look[1], c.look[2]);
    focusLight.intensity = focusTarget;
    focusLight.position.copy(focusPosGoal);
    focusLight.target.position.copy(focusTgtGoal);
    panelEl.classList.add('open', 'show-title', 'show-content');
    document.body.classList.add('panel-open');
    snapBoardLift();
  } else {
    flyCameraTo(c.pos, c.look, dur);
    scheduleReveal(dur * 1000);
  }
}
function goMain(opts = {}) {
  activeZone = -1; mode = 'main';
  menuEl.classList.remove('receded');
  menuItems.forEach((b) => b.classList.remove('active'));
  hidePanel();
  clearZoneLift();
  focusTarget = 0;
  panelAnchor = null;
  const v = VIEWS.main;
  if (opts.instant) {
    if (gsap) gsap.killTweensOf([camPos, camLook]);
    manualTween = null;
    camPos.set(v.pos[0], v.pos[1], v.pos[2]);
    camLook.set(v.look[0], v.look[1], v.look[2]);
  } else {
    flyCameraTo(v.pos, v.look, 1.7);
  }
}
function selectView(name) {
  hidePanel();
  clearZoneLift();
  focusTarget = 0;
  panelAnchor = null;
  menuEl.classList.remove('receded');
  menuItems.forEach((b) => b.classList.remove('active'));
  activeZone = -1;
  mode = name === 'main' ? 'main' : 'view';
  flyTo(name);
}
function applyLang(l, save = true) {
  lang = I18N[l] ? l : 'zh';
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  menuItems.forEach((b, j) => { b.querySelector('.mlabel').textContent = t.menu[j]; });
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const k = el.dataset.i18n;
    if (t[k]) el.textContent = t[k];
  });
  panelBackEl.textContent = t.back;
  langBtns.forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
  if (activeZone >= 0) setPanelContent(activeZone);
  repaintCards(lang);
  if (save) { try { localStorage.setItem('profile-lang', lang); } catch (e) { /* private mode */ } }
}

// Screen-space panel tracking from the 3D zone anchor (desktop only;
// narrow screens use the bottom-sheet layout from CSS)
const _pv = new THREE.Vector3();
function updatePanelPosition() {
  if (!panelAnchor || !panelEl.classList.contains('open') || isNarrow()) return;
  _pv.copy(panelAnchor).project(camera);
  if (_pv.z > 1) return;
  const sx = (_pv.x * 0.5 + 0.5) * window.innerWidth;
  const sy = (-_pv.y * 0.5 + 0.5) * window.innerHeight;
  const pw = panelEl.offsetWidth, ph = panelEl.offsetHeight;
  let left = panelSide === 'right' ? sx + 30 : sx - 30 - pw;
  left = THREE.MathUtils.clamp(left, 16, Math.max(16, window.innerWidth - pw - 16));
  let top = sy - ph / 2;
  top = THREE.MathUtils.clamp(top, 76, Math.max(76, window.innerHeight - ph - 96));
  panelEl.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
}

// Wiring
menuItems.forEach((b) => b.addEventListener('click', () => {
  const i = parseInt(b.dataset.zone, 10);
  if (activeZone === i && mode === 'zone') goMain();
  else selectZone(i);
}));
panelBackEl.addEventListener('click', () => goMain());
langBtns.forEach((b) => b.addEventListener('click', () => applyLang(b.dataset.lang)));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (mode === 'zone') goMain();
    else if (mode === 'view') selectView('main');
  }
});
menuEl.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const idx = menuItems.indexOf(document.activeElement);
  const next = e.key === 'ArrowDown'
    ? (idx + 1) % menuItems.length
    : (idx - 1 + menuItems.length) % menuItems.length;
  menuItems[next].focus();
});

// Initial language + starting state (?lang= / saved choice; ?zone=N opens a zone)
try { lang = params.get('lang') || localStorage.getItem('profile-lang') || 'zh'; }
catch (e) { lang = params.get('lang') || 'zh'; }
applyLang(lang, false);
if (START_VIEW in VIEWS && START_VIEW !== 'main') { mode = 'view'; }
{
  const zp = parseInt(params.get('zone') || '', 10);
  if (Number.isInteger(zp) && zp >= 1 && zp <= 5) selectZone(zp - 1, { instant: true });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  document.getElementById('fallback').style.display = 'flex';
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let firstFrame = true;
let frames = 0;
const loader = document.getElementById('loader');
setTimeout(() => loader.classList.add('done'), 6000); // safety
function animate() {
  const t = clock.getElapsedTime();

  if (manualTween) {
    const k = Math.min(1, (performance.now() - manualTween.t0) / manualTween.dur);
    const e = easeInOut(k);
    camPos.lerpVectors(manualTween.fromP, manualTween.toP, e);
    camLook.lerpVectors(manualTween.fromL, manualTween.toL, e);
    if (k >= 1) { const cb = manualTween.onDone; manualTween = null; if (cb) cb(); }
  }

  // Idle breathing + parallax (frozen in ?static mode for screenshots)
  smx += (mx - smx) * 0.045;
  smy += (my - smy) * 0.045;
  let swayX = 0, swayY = 0, swayLX = 0, swayLY = 0;
  if (!STATIC) {
    swayX = Math.sin(t * 0.31) * 0.012 + Math.sin(t * 0.83) * 0.004;
    swayY = Math.sin(t * 0.47 + 1.3) * 0.009;
    swayLX = Math.sin(t * 0.27 + 0.5) * 0.02;
    swayLY = Math.sin(t * 0.39 + 2.1) * 0.012;
  }
  camera.position.set(
    camPos.x + smx * 0.09 + swayX,
    camPos.y - smy * 0.05 + swayY,
    camPos.z
  );
  camera.lookAt(
    camLook.x + smx * 0.06 + swayLX,
    camLook.y - smy * 0.035 + swayLY,
    camLook.z
  );

  // Dust drift
  if (!STATIC) {
    const pos = dustGeo.attributes.position;
    for (let i = 0; i < DUST_N; i++) {
      const ph = dustPhase[i];
      pos.array[i * 3] = dustBase[i * 3] + Math.cos(t * 0.11 + ph) * 0.03;
      pos.array[i * 3 + 1] = dustBase[i * 3 + 1] + Math.sin(t * 0.15 + ph) * 0.035;
      pos.array[i * 3 + 2] = dustBase[i * 3 + 2] + Math.sin(t * 0.09 + ph * 1.7) * 0.02;
    }
    pos.needsUpdate = true;
  }

  // Focus spotlight easing + spatial panel tracking
  focusLight.intensity += (focusTarget - focusLight.intensity) * 0.07;
  focusLight.position.lerp(focusPosGoal, 0.07);
  focusLight.target.position.lerp(focusTgtGoal, 0.07);
  focusLight.target.updateMatrixWorld();
  // Pinboard cards floating off the board when their zone is focused.
  // One shared bob for the whole board: cards rise and sway together,
  // so stacked cards never drift through each other.
  const bobAll = STATIC ? 0 : Math.sin(t * 1.1) * 0.0035;
  for (const it of boardItems) {
    if (performance.now() < it.liftAt) continue;
    it.lift += (it.goal - it.lift) * 0.09;
    if (Math.abs(it.goal - it.lift) < 0.002) it.lift = it.goal;
    it.obj.position.z = it.baseZ + it.lift * 0.055 + bobAll * it.lift;
  }

  updatePanelPosition();

  renderer.render(scene, camera);
  frames++;
  if (firstFrame) {
    firstFrame = false;
    loader.classList.add('done');
    window.__ready = true;
  }
  // In ?static mode (screenshots), stop after a few settled frames.
  if (!STATIC || frames < 5) requestAnimationFrame(animate);
}
animate();
</script>
